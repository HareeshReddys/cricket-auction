name: Publish dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'backend/src/domain.ts', 'scripts/**', 'index.html', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Require configured backend
        env:
          BOUNDARY_API_URL: ${{ vars.BOUNDARY_API_URL }}
        run: |
          if [ -z "$BOUNDARY_API_URL" ]; then
            echo "Set repository variable BOUNDARY_API_URL after deploying the independent API. Existing Pages deployment is preserved."
            exit 1
          fi
      - name: Build standalone dashboard
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.BOUNDARY_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
